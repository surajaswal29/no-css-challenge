<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rainy Window | CSS Miracles</title>
  <style>
    /* Out-of-focus city lights behind a wet pane. Streaks are animated gradients,
       drops on the glass are tiny lenses made of radial gradients. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(#0b0d1a, #1a1830 55%, #2b1f33);
    }

    .bokeh i {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--s);
      height: var(--s);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--c), 0.55) 0 55%, rgba(var(--c), 0.2) 70%, transparent 72%);
      filter: blur(3px);
      mix-blend-mode: screen;
      animation: glow var(--t) ease-in-out var(--d) infinite alternate;
    }

    .fog {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 120%, rgba(160, 150, 200, 0.25), transparent 60%);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .streaks {
      position: absolute;
      inset: -10%;
      background:
        repeating-linear-gradient(100deg, transparent 0 22px, rgba(200, 210, 255, 0.10) 22px 23px, transparent 23px 57px) 0 0 / 100% 180px,
        repeating-linear-gradient(97deg, transparent 0 41px, rgba(200, 210, 255, 0.07) 41px 42px, transparent 42px 90px) 0 0 / 100% 260px;
      mask-image: repeating-linear-gradient(transparent 0 30px, #000 30px 90px);
      animation: fall 0.6s linear infinite;
    }

    .streaks.slow {
      opacity: 0.6;
      animation-duration: 1s;
      transform: scaleX(-1);
    }

    /* Drops that cling to the glass and slowly slide down. */
    .glass b {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--s);
      height: calc(var(--s) * 1.15);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.8) 0 12%, transparent 16%),
        radial-gradient(circle at 50% 60%, rgba(255, 220, 180, 0.25), rgba(20, 20, 40, 0.3) 70%);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), inset 0 -2px 3px rgba(255, 255, 255, 0.25);
      animation: slide var(--t) cubic-bezier(0.7, 0, 0.3, 1) var(--d) infinite;
    }

    .lamp {
      position: absolute;
      bottom: -30vh;
      left: -20vw;
      width: 70vmax;
      height: 70vmax;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 170, 90, 0.28), transparent 60%);
      animation: glow 6s ease-in-out infinite alternate;
    }

    .frame {
      position: absolute;
      inset: 0;
      border: 2.5vmin solid #120e14;
      background:
        linear-gradient(#120e14, #120e14) 50% 0 / 1.6vmin 100% no-repeat,
        linear-gradient(#120e14, #120e14) 0 50% / 100% 1.6vmin no-repeat;
      box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.8);
    }

    .caption {
      position: absolute;
      bottom: 5vh;
      right: 5vw;
      padding: 0.5rem 1rem;
      font-style: italic;
      color: rgba(255, 225, 190, 0.75);
      font-size: clamp(0.9rem, 2.2vw, 1.15rem);
      background: rgba(18, 14, 20, 0.6);
      border-radius: 0.5rem;
    }

    @keyframes glow { to { opacity: 0.45; scale: 0.9; } }
    @keyframes fall { to { background-position: -30px 180px, -40px 260px; } }

    @keyframes slide {
      0%, 55% { transform: translateY(0); opacity: 1; }
      85%     { opacity: 1; }
      100%    { transform: translateY(40vh); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .streaks { animation-duration: 6s; }
      .glass b { animation-duration: 40s; }
    }
  </style>
</head>
<body>
