<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar System | CSS Miracles</title>
  <style>
    /* Pure CSS orrery: every orbit is a rotating ring, every planet is a gradient. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root { --u: min(1vmin, 8px); }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(1px 1px at 12% 18%, #fff, transparent),
        radial-gradient(1px 1px at 82% 22%, #fff, transparent),
        radial-gradient(1px 1px at 22% 78%, #fff, transparent),
        radial-gradient(1px 1px at 68% 88%, #fff, transparent),
        radial-gradient(1px 1px at 92% 58%, #fff, transparent),
        radial-gradient(1px 1px at 5% 50%, #fff, transparent),
        radial-gradient(1px 1px at 40% 8%, #fff, transparent),
        radial-gradient(1px 1px at 58% 96%, #fff, transparent),
        radial-gradient(circle at center, #1b1033 0%, #04020a 70%);
    }

    .system {
      position: relative;
      width: calc(96 * var(--u));
      height: calc(96 * var(--u));
      transform: rotateX(55deg);
      transform-style: preserve-3d;
    }

    .sun {
      position: absolute;
      inset: calc(50% - 5 * var(--u));
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #fff7c2, #ffcc33 35%, #ff7a00 70%, #c43b00);
      box-shadow:
        0 0 calc(4 * var(--u)) #ffb300,
        0 0 calc(10 * var(--u)) #ff6a00,
        0 0 calc(20 * var(--u)) rgba(255, 80, 0, 0.5);
      animation: flare 3s ease-in-out infinite alternate;
    }

    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--d);
      height: var(--d);
      margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      animation: orbit var(--t) linear infinite;
    }

    .planet {
      position: absolute;
      top: 50%;
      left: 0;
      width: var(--s);
      height: var(--s);
      margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
      border-radius: 50%;
      background: var(--bg);
      box-shadow: inset calc(var(--s) / -4) 0 calc(var(--s) / 3) rgba(0, 0, 0, 0.75);
    }

    .mercury { animation-delay: -1s; --d: calc(16 * var(--u)); --t: 3s; }
    .mercury .planet { --s: calc(1.4 * var(--u)); --bg: #a9a9a9; }

    .venus { animation-delay: -4s; --d: calc(24 * var(--u)); --t: 7s; }
    .venus .planet { --s: calc(2.2 * var(--u)); --bg: radial-gradient(circle at 30% 30%, #fff1c1, #e3b04b); }

    .earth { animation-delay: -2s; --d: calc(34 * var(--u)); --t: 11s; }
    .earth .planet {
      --s: calc(2.6 * var(--u));
      --bg:
        radial-gradient(circle at 30% 35%, #3fbf5f 18%, transparent 20%),
        radial-gradient(circle at 65% 60%, #3fbf5f 14%, transparent 16%),
        radial-gradient(circle at 40% 40%, #62b6ff, #1560bd);
    }
    .earth .planet::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(6 * var(--u));
      height: calc(6 * var(--u));
      margin: calc(-3 * var(--u)) 0 0 calc(-3 * var(--u));
      border-radius: 50%;
      background: radial-gradient(circle at 50% 0, #ddd calc(0.6 * var(--u)), transparent calc(0.7 * var(--u)));
      animation: orbit 2s linear infinite;
    }

    .mars { animation-delay: -13s; --d: calc(44 * var(--u)); --t: 18s; }
    .mars .planet { --s: calc(2 * var(--u)); --bg: radial-gradient(circle at 30% 30%, #ff9a6b, #b83a14); }

    .jupiter { animation-delay: -9s; --d: calc(60 * var(--u)); --t: 32s; }
    .jupiter .planet {
      --s: calc(6 * var(--u));
      --bg: repeating-linear-gradient(0deg, #d9a066 0 12%, #f3d8b0 12% 22%, #b9723a 22% 30%, #e8c49a 30% 40%);
    }

    .saturn { animation-delay: -30s; --d: calc(76 * var(--u)); --t: 48s; }
    .saturn .planet { --s: calc(5 * var(--u)); --bg: radial-gradient(circle at 35% 35%, #fff0c4, #d6b16b); }
    .saturn .planet::before {
      content: "";
      position: absolute;
      inset: calc(-2.5 * var(--u)) calc(-3.5 * var(--u));
      border-radius: 50%;
      border: calc(1 * var(--u)) solid rgba(230, 200, 140, 0.7);
      transform: rotate(-20deg);
    }

    .neptune { animation-delay: -52s; --d: calc(92 * var(--u)); --t: 70s; }
    .neptune .planet { --s: calc(3.6 * var(--u)); --bg: radial-gradient(circle at 30% 30%, #9ee7ff, #2c5bd4); }

    .title {
      position: fixed;
      bottom: 2rem;
      width: 100%;
      text-align: center;
      font-weight: 200;
      letter-spacing: 0.6em;
      font-size: clamp(0.8rem, 2vw, 1.1rem);
      color: #ffd98a;
      text-transform: uppercase;
      text-shadow: 0 0 12px #ff8a00;
    }

    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes flare {
      to { box-shadow: 0 0 calc(6 * var(--u)) #ffd000, 0 0 calc(14 * var(--u)) #ff6a00, 0 0 calc(28 * var(--u)) rgba(255, 80, 0, 0.6); }
    }

    .system:hover .orbit,
    .system:hover .planet::after { animation-play-state: paused; }
  </style>
</head>
<body>
  <div class="system">
    <div class="sun"></div>
    <div class="orbit mercury"><div class="planet"></div></div>
    <div class="orbit venus"><div class="planet"></div></div>
    <div class="orbit earth"><div class="planet"></div></div>
    <div class="orbit mars"><div class="planet"></div></div>
    <div class="orbit jupiter"><div class="planet"></div></div>
    <div class="orbit saturn"><div class="planet"></div></div>
    <div class="orbit neptune"><div class="planet"></div></div>
  </div>
  <p class="title">Orrery &middot; zero lines of JavaScript</p>
</body>
</html>
