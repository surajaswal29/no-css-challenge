<head>
  <meta charset="UTF-8">

  <title>Hypnosis | CSS Miracles</title>
  <style>
    /* Three mesmerising systems driven by one custom property, --i:
       a sunflower (phyllotaxis) using sqrt() and the golden angle,
       a pendulum wave whose periods are 60s / (40 + i),
       and a twisting tunnel of squares with staggered delays. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      padding: clamp(1rem, 3vw, 2.5rem);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #dfe7ff;
      background: radial-gradient(circle at 50% 0, #1b2150, #070817 70%);
    }

    h1 {
      text-align: center;
      font-weight: 200;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      font-size: clamp(1rem, 3vw, 1.5rem);
      margin-bottom: 2rem;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    figure {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border-radius: 1.5rem;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.03);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      position: relative;
    }

    figcaption {
      position: absolute;
      bottom: 0.9rem;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(223, 231, 255, 0.55);
    }

    /* ---------- Sunflower ---------- */
    .sunflower {
      position: relative;
      width: 0;
      height: 0;
      animation: turn 120s linear infinite;
    }

    .sunflower i {
      position: absolute;
      width: 7px;
      height: 7px;
      margin: -3.5px;
      border-radius: 50%;
      background: hsl(calc(180 + var(--i) * 0.9) 90% 65%);
      transform: rotate(calc(var(--i) * 137.508deg)) translateX(calc(sqrt(var(--i)) * 9.5px));
      animation: seed 4s ease-in-out infinite;
      animation-delay: calc(var(--i) * -0.045s);
    }

    /* ---------- Pendulum wave ---------- */
    .pendulums {
      position: relative;
      width: 70%;
      height: 75%;
      display: flex;
      justify-content: space-between;
    }

    .pendulums i {
      position: relative;
      flex: 0 0 2px;
      height: calc(40% + var(--i) * 2.4%);
      background: linear-gradient(rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.35));
      transform-origin: top center;
      animation: swing calc(30s / (20 + var(--i))) ease-in-out infinite alternate;
      animation-delay: calc(-30s / (20 + var(--i)) / 2);
    }

    .pendulums i::after {
      content: "";
      position: absolute;
      bottom: -7px;
      left: -6px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: hsl(calc(260 + var(--i) * 8) 90% 70%);
      box-shadow: 0 0 12px hsl(calc(260 + var(--i) * 8) 90% 60%);
    }

    /* ---------- Square tunnel ---------- */
    .tunnel {
      position: relative;
      width: 58%;
      aspect-ratio: 1;
    }

    .tunnel i {
      position: absolute;
      inset: calc(var(--i) * 3.5%);
      border: 1.5px solid hsl(calc(170 + var(--i) * 12) 85% 65% / calc(1 - var(--i) * 0.05));
      border-radius: calc(var(--i) * 2px);
      animation: twist 6s ease-in-out infinite alternate;
      animation-delay: calc(var(--i) * -0.18s);
    }

    @keyframes turn  { to { rotate: 360deg; } }
    @keyframes seed  { 50% { scale: 0.25; opacity: 0.35; } }
    @keyframes swing { from { rotate: 16deg; } to { rotate: -16deg; } }
    @keyframes twist { from { rotate: -30deg; } to { rotate: 30deg; } }

    @media (prefers-reduced-motion: reduce) {
      .sunflower, .sunflower i, .tunnel i { animation-duration: 60s; }
    }
  </style>
