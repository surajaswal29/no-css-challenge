<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Glass | CSS Miracles</title>
  <style>
    /* Glassmorphism over drifting aurora blobs, with an animated conic border. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @property --angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #fff;
      background: #070b1a;
    }

    .aurora {
      position: fixed;
      inset: -20%;
      filter: blur(70px) saturate(1.4);
    }

    .aurora span {
      position: absolute;
      width: 45vmax;
      height: 45vmax;
      border-radius: 50%;
      mix-blend-mode: screen;
      opacity: 0.7;
      animation: float var(--t) ease-in-out infinite alternate;
    }

    .aurora span:nth-child(1) { --t: 14s; top: 10%; left: 5%;  background: #00e5a0; }
    .aurora span:nth-child(2) { --t: 18s; top: 30%; left: 45%; background: #7c4dff; animation-direction: alternate-reverse; }
    .aurora span:nth-child(3) { --t: 22s; top: 50%; left: 15%; background: #ff3d9a; }
    .aurora span:nth-child(4) { --t: 16s; top: 0;   left: 60%; background: #00b0ff; animation-direction: alternate-reverse; }

    .noise {
      position: fixed;
      inset: 0;
      opacity: 0.08;
      background: repeating-radial-gradient(circle at 17% 32%, #fff 0 1px, transparent 1px 3px);
      pointer-events: none;
    }

    .card {
      position: relative;
      width: min(420px, 100%);
      padding: 2.5rem 2rem;
      border-radius: 1.75rem;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Rotating gradient border drawn by a masked pseudo-element. */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 2px;
      border-radius: inherit;
      background: conic-gradient(from var(--angle), #00e5a0, #00b0ff, #7c4dff, #ff3d9a, #00e5a0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      -webkit-mask-composite: xor;
      animation: rotate 4s linear infinite;
    }

    .card:hover { transform: translateY(-6px) rotateX(4deg); }

    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 38%, #ffe0c2 0 17%, transparent 18%),
        radial-gradient(ellipse at 50% 100%, #ffe0c2 0 38%, transparent 39%),
        radial-gradient(circle at 50% 30%, #3b2a20 0 24%, transparent 25%),
        linear-gradient(135deg, #7c4dff, #ff3d9a);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.2);
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
    }

    .role {
      margin: 0.25rem 0 1.5rem;
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      text-align: center;
    }

    .stats div {
      padding: 0.75rem 0.25rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.07);
    }

    .stats strong { display: block; font-size: 1.3rem; }
    .stats span { font-size: 0.75rem; color: rgba(255, 255, 255, 0.65); text-transform: uppercase; letter-spacing: 0.08em; }

    .btn {
      display: block;
      padding: 0.9rem;
      border-radius: 999px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      color: #0b0f24;
      background: linear-gradient(90deg, #00e5a0, #00b0ff, #7c4dff, #ff3d9a, #00e5a0) 0 0 / 300% 100%;
      transition: background-position 0.8s ease, box-shadow 0.3s;
    }

    .btn:hover,
    .btn:focus-visible {
      background-position: 100% 0;
      box-shadow: 0 0 30px rgba(124, 77, 255, 0.7);
      outline: none;
    }

    @keyframes rotate { to { --angle: 360deg; } }

    @keyframes float {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(20vw, -15vh) scale(1.3); }
    }
  </style>
</head>
<body>
  <div class="aurora"><span></span><span></span><span></span><span></span></div>
  <div class="noise"></div>

  <article class="card">
    <div class="avatar" role="img" aria-label="Avatar drawn with CSS gradients"></div>
    <h1>Ada Stylesheet</h1>
    <p class="role">Cascading Style Sorceress</p>
    <div class="stats">
      <div><strong>0</strong><span>JS lines</span></div>
      <div><strong>∞</strong><span>Gradients</span></div>
      <div><strong>60</strong><span>FPS</span></div>
    </div>
    <a class="btn" href="index.html">Back to the gallery</a>
  </article>
</body>
</html>
