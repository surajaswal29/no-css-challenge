<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hypercube | CSS Miracles</title>
  <style>
    /* Pure CSS: a cube within a cube, spinning in 3D space. Hover to freeze time. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --size: min(38vmin, 280px);
      --inner: calc(var(--size) * 0.45);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #cfd8ff;
      background:
        radial-gradient(1px 1px at 10% 20%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 30% 80%, #fff 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 55% 35%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 75% 15%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 88% 70%, #fff 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 15% 60%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 45% 92%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 65% 58%, #fff 50%, transparent 51%),
        radial-gradient(ellipse at 50% 120%, #3a1c71 0%, transparent 60%),
        radial-gradient(ellipse at 50% -20%, #0f3460 0%, transparent 60%),
        #05050f;
    }

    .scene {
      width: var(--size);
      height: var(--size);
      perspective: 900px;
    }

    .cube, .cube--inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: spin 14s linear infinite;
    }

    .scene:hover .cube,
    .scene:hover .cube--inner { animation-play-state: paused; }

    .face {
      position: absolute;
      inset: 0;
      border: 2px solid rgba(120, 220, 255, 0.8);
      background:
        linear-gradient(rgba(120, 220, 255, 0.12) 1px, transparent 1px) 0 0 / 20% 20%,
        linear-gradient(90deg, rgba(120, 220, 255, 0.12) 1px, transparent 1px) 0 0 / 20% 20%,
        linear-gradient(135deg, rgba(79, 172, 254, 0.18), rgba(240, 80, 200, 0.18));
      box-shadow:
        0 0 30px rgba(79, 172, 254, 0.45),
        inset 0 0 40px rgba(240, 80, 200, 0.35);
      backface-visibility: visible;
    }

    .front  { transform: translateZ(calc(var(--size) / 2)); }
    .back   { transform: rotateY(180deg) translateZ(calc(var(--size) / 2)); }
    .right  { transform: rotateY(90deg) translateZ(calc(var(--size) / 2)); }
    .left   { transform: rotateY(-90deg) translateZ(calc(var(--size) / 2)); }
    .top    { transform: rotateX(90deg) translateZ(calc(var(--size) / 2)); }
    .bottom { transform: rotateX(-90deg) translateZ(calc(var(--size) / 2)); }

    .cube--inner {
      position: absolute;
      width: var(--inner);
      height: var(--inner);
      top: calc(50% - var(--inner) / 2);
      left: calc(50% - var(--inner) / 2);
      animation: spin-reverse 7s linear infinite;
    }

    .cube--inner .face {
      border-color: rgba(255, 140, 220, 0.95);
      background: radial-gradient(circle, rgba(255, 140, 220, 0.5), rgba(120, 60, 255, 0.15));
      box-shadow: 0 0 25px rgba(255, 110, 210, 0.8);
    }

    .cube--inner .front  { transform: translateZ(calc(var(--inner) / 2)); }
    .cube--inner .back   { transform: rotateY(180deg) translateZ(calc(var(--inner) / 2)); }
    .cube--inner .right  { transform: rotateY(90deg) translateZ(calc(var(--inner) / 2)); }
    .cube--inner .left   { transform: rotateY(-90deg) translateZ(calc(var(--inner) / 2)); }
    .cube--inner .top    { transform: rotateX(90deg) translateZ(calc(var(--inner) / 2)); }
    .cube--inner .bottom { transform: rotateX(-90deg) translateZ(calc(var(--inner) / 2)); }

    .core {
      position: absolute;
      inset: 35%;
      border-radius: 50%;
      background: radial-gradient(circle, #fff, #7df9ff 40%, transparent 70%);
      filter: blur(2px);
      animation: pulse 2s ease-in-out infinite;
    }

    .floor {
      position: fixed;
      bottom: -10vh;
      left: -50vw;
      width: 200vw;
      height: 60vh;
      transform: perspective(400px) rotateX(70deg);
      background:
        linear-gradient(rgba(240, 80, 200, 0.5) 2px, transparent 2px) 0 0 / 60px 60px,
        linear-gradient(90deg, rgba(240, 80, 200, 0.5) 2px, transparent 2px) 0 0 / 60px 60px;
      mask-image: linear-gradient(to top, #000 10%, transparent 90%);
      animation: grid-move 1.5s linear infinite;
    }

    .caption {
      position: fixed;
      top: 2rem;
      width: 100%;
      text-align: center;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      font-size: 0.8rem;
      opacity: 0.8;
    }

    @keyframes spin {
      from { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      to   { transform: rotateX(360deg) rotateY(720deg) rotateZ(360deg); }
    }
    @keyframes spin-reverse {
      from { transform: rotateX(360deg) rotateY(0deg); }
      to   { transform: rotateX(0deg) rotateY(-360deg); }
    }
    @keyframes pulse {
      50% { transform: scale(1.4); opacity: 0.6; }
    }
    @keyframes grid-move {
      to { background-position: 0 60px, 0 60px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 60s !important; }
    }
  </style>
</head>
<body>
  <p class="caption">Hypercube &middot; hover to freeze time</p>
  <div class="floor"></div>
  <div class="scene">
    <div class="cube">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
      <div class="cube--inner">
        <div class="face front"></div>
        <div class="face back"></div>
        <div class="face right"></div>
        <div class="face left"></div>
        <div class="face top"></div>
        <div class="face bottom"></div>
        <div class="core"></div>
      </div>
    </div>
  </div>
</body>
</html>
