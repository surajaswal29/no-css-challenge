<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loader Lab | CSS Miracles</title>
  <style>
    /* Twelve loaders. Most use a single element plus pseudo-elements. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      padding: clamp(1rem, 4vw, 3rem);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #e8e6f5;
      background: #14121f;
    }

    h1 {
      margin-bottom: 2rem;
      text-align: center;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-size: clamp(1.1rem, 3vw, 1.6rem);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 1rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .cell {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border-radius: 1rem;
      background: #1d1a2d;
      box-shadow: inset 0 0 0 1px #2b2742;
    }

    /* 1. Gradient ring */
    .ring {
      width: 56px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent, #7c4dff, #ff6fb5);
      mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
      animation: spin 1s linear infinite;
    }

    /* 2. Bouncing dots */
    .dots {
      width: 60px;
      aspect-ratio: 4;
      background:
        radial-gradient(circle closest-side, #4dd0e1 90%, transparent) 0 50% / calc(100% / 3) 100% no-repeat,
        radial-gradient(circle closest-side, #4dd0e1 90%, transparent) 50% 50% / calc(100% / 3) 100% no-repeat,
        radial-gradient(circle closest-side, #4dd0e1 90%, transparent) 100% 50% / calc(100% / 3) 100% no-repeat;
      animation: dots 1s infinite linear;
    }

    /* 3. Pac-man */
    .pac {
      position: relative;
      width: 50px;
      height: 50px;
    }
    .pac::before, .pac::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #ffd54a;
      clip-path: polygon(0 0, 100% 0, 100% 50%, 50% 50%, 0 50%);
      animation: chomp-top 0.4s ease-in-out infinite alternate;
    }
    .pac::after {
      clip-path: polygon(0 50%, 50% 50%, 100% 50%, 100% 100%, 0 100%);
      animation-name: chomp-bottom;
    }

    /* 4. Equalizer bars */
    .bars {
      width: 50px;
      height: 44px;
      --bar: linear-gradient(#69f0ae, #00bfa5);
      background: var(--bar) 0 100%, var(--bar) 50% 100%, var(--bar) 100% 100%;
      background-size: 10px 100%;
      background-repeat: no-repeat;
      animation: bars 1s infinite ease-in-out;
    }

    /* 5. Morphing blob */
    .blob {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #ff8a65, #ff4081);
      animation: morph 2.4s ease-in-out infinite;
    }

    /* 6. Orbiting atoms */
    .atom {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 4px, transparent 5px);
    }
    .atom::before, .atom::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #82b1ff;
      border-bottom-color: #82b1ff;
      animation: spin 1.2s linear infinite;
    }
    .atom::after {
      inset: 10px;
      border-top-color: #ea80fc;
      border-bottom-color: #ea80fc;
      animation-direction: reverse;
      animation-duration: 0.8s;
    }

    /* 7. Typing text */
    .typing {
      font-family: "Courier New", monospace;
      font-size: 1.2rem;
      width: 10ch;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid #b388ff;
      animation: type 2.5s steps(10) infinite, caret 0.6s step-end infinite;
    }

    /* 8. Hourglass */
    .hourglass {
      width: 40px;
      height: 56px;
      background:
        conic-gradient(from -36deg at 50% 100%, #ffab40 72deg, transparent 0) top / 100% 50% no-repeat,
        conic-gradient(from 144deg at 50% 0, #ffab40 72deg, transparent 0) bottom / 100% 50% no-repeat;
      animation: flip 1.5s infinite ease-in-out;
    }

    /* 9. Wave squares */
    .wave {
      display: flex;
      gap: 5px;
    }
    .wave i {
      width: 10px;
      height: 10px;
      background: #40c4ff;
      animation: wave 1s ease-in-out infinite;
      animation-delay: calc(var(--i) * 0.1s);
    }

    /* 10. Heartbeat */
    .heart {
      width: 34px;
      height: 34px;
      background: #ff5252;
      transform: rotate(45deg);
      animation: beat 1s infinite;
      position: relative;
    }
    .heart::before, .heart::after {
      content: "";
      position: absolute;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: inherit;
    }
    .heart::before { left: -17px; }
    .heart::after { top: -17px; }

    /* 11. Progress stripes */
    .stripes {
      width: 120px;
      height: 16px;
      border-radius: 16px;
      background: repeating-linear-gradient(-45deg, #7c4dff 0 10px, #b388ff 10px 20px) 0 0 / 28.28px 100%;
      animation: stripes 0.6s linear infinite;
      box-shadow: 0 0 12px rgba(124, 77, 255, 0.6);
    }

    /* 12. Radar */
    .radar {
      width: 64px;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle, transparent 30%, rgba(105, 240, 174, 0.3) 31%, transparent 33%, transparent 63%, rgba(105, 240, 174, 0.3) 64%, transparent 66%),
        conic-gradient(rgba(105, 240, 174, 0.8), transparent 25%);
      box-shadow: 0 0 0 2px rgba(105, 240, 174, 0.4);
      animation: spin 1.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(1turn); } }

    @keyframes dots {
      20% { background-position: 0 0, 50% 50%, 100% 50%; }
      40% { background-position: 0 100%, 50% 0, 100% 50%; }
      60% { background-position: 0 50%, 50% 100%, 100% 0; }
      80% { background-position: 0 50%, 50% 50%, 100% 100%; }
    }

    @keyframes chomp-top { to { transform: rotate(-35deg); } }
    @keyframes chomp-bottom { to { transform: rotate(35deg); } }

    @keyframes bars {
      0%, 100% { background-size: 10px 30%, 10px 90%, 10px 50%; }
      33%      { background-size: 10px 90%, 10px 40%, 10px 100%; }
      66%      { background-size: 10px 50%, 10px 100%, 10px 25%; }
    }

    @keyframes morph {
      0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: rotate(0); }
      50%      { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; transform: rotate(180deg); }
    }

    @keyframes type { from { width: 0; } }
    @keyframes caret { 50% { border-color: transparent; } }

    @keyframes flip {
      0%   { transform: rotate(0); }
      60%, 100% { transform: rotate(180deg); }
    }

    @keyframes wave {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50%      { transform: translateY(-14px); opacity: 1; }
    }

    @keyframes beat {
      0%, 40%, 100% { transform: rotate(45deg) scale(0.8); }
      20%, 60% { transform: rotate(45deg) scale(1); }
    }

    @keyframes stripes { to { background-position: 28.28px 0; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 6s !important; }
    }
  </style>
</head>
<body>
  <h1>Loader Lab</h1>
  <div class="grid">
    <div class="cell"><div class="ring" role="img" aria-label="Gradient ring loader"></div></div>
    <div class="cell"><div class="dots" role="img" aria-label="Bouncing dots loader"></div></div>
    <div class="cell"><div class="pac" role="img" aria-label="Pac-man loader"></div></div>
    <div class="cell"><div class="bars" role="img" aria-label="Equalizer loader"></div></div>
    <div class="cell"><div class="blob" role="img" aria-label="Morphing blob loader"></div></div>
    <div class="cell"><div class="atom" role="img" aria-label="Atom loader"></div></div>
    <div class="cell"><div class="typing">Loading...</div></div>
    <div class="cell"><div class="hourglass" role="img" aria-label="Hourglass loader"></div></div>
    <div class="cell">
      <div class="wave" role="img" aria-label="Wave loader">
        <i style="--i: 0"></i><i style="--i: 1"></i><i style="--i: 2"></i><i style="--i: 3"></i><i style="--i: 4"></i>
      </div>
    </div>
    <div class="cell"><div class="heart" role="img" aria-label="Heartbeat loader"></div></div>
    <div class="cell"><div class="stripes" role="img" aria-label="Striped progress loader"></div></div>
    <div class="cell"><div class="radar" role="img" aria-label="Radar loader"></div></div>
  </div>
</body>
</html>
