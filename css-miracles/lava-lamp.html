<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lava Lamp | CSS Miracles</title>
  <style>
    /* The "gooey" metaball trick: blur the blobs, then crank the contrast of their
       container. Soft edges snap back to crisp ones, and nearby blobs melt together.
       A gradient on top (mix-blend-mode: multiply) paints the white goo. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root { --w: min(34vmin, 240px); }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 50% 55%, #3a1430, #12060f 70%);
    }

    .lamp {
      position: relative;
      width: var(--w);
      display: grid;
      justify-items: center;
      filter: drop-shadow(0 0 60px rgba(255, 90, 60, 0.35));
    }

    .cap {
      width: 42%;
      height: calc(var(--w) * 0.28);
      background: linear-gradient(90deg, #6d6f78, #d9dbe3 35%, #8a8c95 70%, #4d4f57);
      clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%);
    }

    .glass {
      position: relative;
      width: 100%;
      height: calc(var(--w) * 1.9);
      overflow: hidden;
      clip-path: polygon(29% 0, 71% 0, 100% 100%, 0 100%);
    }

    .goo {
      position: absolute;
      inset: 0;
      background: #000;
      filter: contrast(30);
    }

    .blob {
      position: absolute;
      left: var(--x);
      bottom: -20%;
      width: var(--s);
      height: var(--s);
      border-radius: 50%;
      background: #fff;
      filter: blur(12px);
      animation: rise var(--t) ease-in-out infinite alternate;
      animation-delay: var(--d);
    }

    .blob:nth-child(1) { --x: 30%; --s: 34%; --t: 14s; --d: 0s; }
    .blob:nth-child(2) { --x: 48%; --s: 26%; --t: 11s; --d: -4s; }
    .blob:nth-child(3) { --x: 20%; --s: 22%; --t: 17s; --d: -9s; }
    .blob:nth-child(4) { --x: 55%; --s: 30%; --t: 19s; --d: -2s; }
    .blob:nth-child(5) { --x: 40%; --s: 18%; --t: 9s;  --d: -6s; }
    .blob:nth-child(6) { --x: 35%; --s: 24%; --t: 15s; --d: -12s; }

    /* The pool of wax that always sits at the bottom. */
    .pool {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -6%;
      height: 16%;
      border-radius: 50%;
      background: #fff;
      filter: blur(12px);
    }

    .tint {
      position: absolute;
      inset: 0;
      mix-blend-mode: multiply;
      background: linear-gradient(#ffd23f, #ff6a3d 45%, #e0245e);
      animation: tint 20s ease-in-out infinite alternate;
    }

    .shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 22%, rgba(255, 255, 255, 0.18) 30%, transparent 38%);
    }

    .base {
      width: 100%;
      height: calc(var(--w) * 0.55);
      background: linear-gradient(90deg, #4d4f57, #d9dbe3 35%, #8a8c95 70%, #3c3e45);
      clip-path: polygon(0 0, 100% 0, 78% 55%, 100% 100%, 0 100%, 22% 55%);
    }

    @keyframes rise {
      0%   { transform: translateY(0) scale(1, 1); }
      50%  { transform: translateY(calc(var(--w) * -0.9)) scale(0.85, 1.2); }
      100% { transform: translateY(calc(var(--w) * -1.8)) scale(1.1, 0.9); }
    }

    @keyframes tint { to { filter: hue-rotate(-60deg); } }

    @media (prefers-reduced-motion: reduce) {
      .blob { animation-duration: 60s; }
    }
  </style>
</head>
<body>
  <div class="lamp" role="img" aria-label="A lava lamp with blobs of wax that slowly rise, merge and fall">
    <div class="cap"></div>
    <div class="glass">
      <div class="goo">
        <div class="blob"></div><div class="blob"></div><div class="blob"></div>
        <div class="blob"></div><div class="blob"></div><div class="blob"></div>
        <div class="pool"></div>
      </div>
      <div class="tint"></div>
      <div class="shine"></div>
    </div>
    <div class="base"></div>
  </div>
</body>
</html>
