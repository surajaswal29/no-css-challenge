<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morning Coffee | CSS Miracles</title>
  <style>
    /* CSS illustration: a steaming cup of coffee on a saucer, with latte art. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root { --u: min(1vmin, 7px); }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background:
        linear-gradient(transparent 62%, #6b4428 62%, #4a2c17),
        radial-gradient(circle at 50% 30%, #d9b894, #9c6f4a 75%);
    }

    .scene {
      position: relative;
      width: calc(60 * var(--u));
      height: calc(70 * var(--u));
    }

    .saucer {
      position: absolute;
      left: calc(2 * var(--u));
      bottom: calc(6 * var(--u));
      width: calc(56 * var(--u));
      height: calc(12 * var(--u));
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 40%, #fff 0 40%, #e9e4dc 55%, #c9c1b5 100%);
      box-shadow: 0 calc(2 * var(--u)) calc(4 * var(--u)) rgba(80, 40, 10, 0.35);
    }

    .cup {
      position: absolute;
      left: calc(12 * var(--u));
      bottom: calc(11 * var(--u));
      width: calc(36 * var(--u));
      height: calc(30 * var(--u));
      border-radius: 0 0 calc(18 * var(--u)) calc(18 * var(--u)) / 0 0 calc(22 * var(--u)) calc(22 * var(--u));
      background: linear-gradient(90deg, #d8d1c6, #fff 30%, #f4f0ea 60%, #cfc6b8);
    }

    .handle {
      position: absolute;
      left: calc(43 * var(--u));
      bottom: calc(22 * var(--u));
      width: calc(13 * var(--u));
      height: calc(13 * var(--u));
      border: calc(3 * var(--u)) solid #e7e1d8;
      border-radius: 50%;
      border-left-color: transparent;
    }

    .rim {
      position: absolute;
      left: calc(12 * var(--u));
      bottom: calc(37 * var(--u));
      width: calc(36 * var(--u));
      height: calc(8 * var(--u));
      border-radius: 50%;
      background: #f7f3ee;
      box-shadow: inset 0 calc(-0.5 * var(--u)) 0 #d4ccbf;
    }

    .coffee {
      position: absolute;
      inset: calc(1 * var(--u)) calc(1.5 * var(--u));
      border-radius: 50%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 50%, #8a5a36, #5b341b 70%, #3d220f);
    }

    /* Latte art heart, turning slowly as if just stirred. The wrapper squashes it onto the surface. */
    .latte {
      position: absolute;
      inset: 0;
      transform: scaleY(0.45);
    }

    .heart {
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(9 * var(--u));
      height: calc(9 * var(--u));
      margin: calc(-4.5 * var(--u)) 0 0 calc(-4.5 * var(--u));
      animation: stir 12s linear infinite;
    }

    .heart i {
      position: absolute;
      top: 38%;
      left: 32%;
      width: 36%;
      height: 36%;
      background: #f6e3c8;
      transform: rotate(45deg);
    }

    .heart i::before,
    .heart i::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: inherit;
    }

    .heart i::before { left: -50%; }
    .heart i::after { top: -50%; }

    .steam {
      position: absolute;
      bottom: calc(43 * var(--u));
      left: var(--x);
      width: calc(4 * var(--u));
      height: calc(18 * var(--u));
      border-radius: 50%;
      background: linear-gradient(transparent, rgba(255, 255, 255, 0.9));
      filter: blur(calc(1.2 * var(--u)));
      opacity: 0;
      animation: steam 3.2s ease-out infinite;
      animation-delay: var(--d);
    }

    .s1 { --x: calc(21 * var(--u)); --d: 0s; }
    .s2 { --x: calc(28 * var(--u)); --d: 1.1s; }
    .s3 { --x: calc(35 * var(--u)); --d: 2.1s; }

    .note {
      position: absolute;
      bottom: calc(-2 * var(--u));
      width: 100%;
      text-align: center;
      font-style: italic;
      color: #f6e3c8;
      font-size: clamp(0.9rem, 2.4vw, 1.2rem);
    }

    @keyframes steam {
      0%   { transform: translateY(0) scaleX(1) skewX(0deg); opacity: 0; }
      20%  { opacity: 0.8; }
      50%  { transform: translateY(calc(-8 * var(--u))) scaleX(1.8) skewX(12deg); }
      100% { transform: translateY(calc(-18 * var(--u))) scaleX(2.4) skewX(-10deg); opacity: 0; }
    }

    @keyframes stir { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="scene" role="img" aria-label="A steaming cup of coffee drawn with CSS">
    <div class="steam s1"></div>
    <div class="steam s2"></div>
    <div class="steam s3"></div>
    <div class="saucer"></div>
    <div class="handle"></div>
    <div class="cup"></div>
    <div class="rim"><div class="coffee"><div class="latte"><div class="heart"><i></i></div></div></div></div>
    <p class="note">Freshly brewed in a stylesheet.</p>
  </div>
</body>
</html>
